<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Архітектори Розуму — Студія</title>
<meta name="description" content="Cinematic Thoughtcast: AI Titans — робоча студія сезону 1: кожен герой має власний робочий стіл з озвучкою ElevenLabs, промптами анімації, музикою, медіа й дослідженнями.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --surface:#141518; --surface-2:#1a1c20; --surface-3:#212429;
  --line:#26292e; --line-soft:#1d1f23;
  --text:#ebe7df; --muted:#a29e95; --dim:#6f6c66;
  --brass:#c8a96a; --brass-hi:#dcc28a; --brass-soft:rgba(200,169,106,.12); --brass-line:rgba(200,169,106,.35);
  --ok:#8fb38a;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --side:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line-soft)}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.brand b{display:block;font:600 19px/1.2 var(--serif);margin-top:4px}
.brand span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.kbtn{margin:12px 14px 4px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:13px;background:var(--bg)}
.kbtn:hover{border-color:var(--brass-line);color:var(--muted)}
.kbtn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
nav{flex:1;overflow:auto;padding:4px 10px 20px}
.ng{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px}
.ni{display:flex;flex-direction:column;padding:6px 10px;border-radius:7px;border-left:2px solid transparent}
.ni b{font-weight:500;font-size:13.5px}
.ni i{font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.35}
.ni:hover,.nh:hover{background:var(--surface-2)}
.ni.on,.nh.on{background:var(--brass-soft);border-left-color:var(--brass)}
.ni.on b,.nh.on b{color:var(--brass-hi)}
.ni.ext b::after{content:" ↗";color:var(--dim);font-weight:400}
.nh{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:5px 10px;border-radius:7px;border-left:2px solid transparent}
.nh img{width:26px;height:26px;border-radius:50%;object-fit:cover;filter:grayscale(.35);border:1px solid var(--line)}
.nh b{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh small{display:block;font:10.5px var(--mono);color:var(--dim)}
.nh em{font:normal 11px var(--mono);color:var(--muted)}
.nh .mbar{grid-column:2/4;height:2px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:-2px}
.nh .mbar i{display:block;height:100%;background:var(--brass)}
details.more summary{list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary.ng::after{content:" +";color:var(--dim)}
details.more[open] summary.ng::after{content:" −"}
.side-foot{padding:10px 20px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--dim)}

/* ---------- main ---------- */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:rgba(13,14,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);padding:12px 36px;display:flex;align-items:center;gap:14px}
.crumbs{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{color:var(--text)}
.crumbs b{color:var(--muted);font-weight:500}
.menu-btn{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;flex:none}
.top .sp{flex:1}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.br{color:var(--brass-hi);border-color:var(--brass-line);background:var(--brass-soft)}
.wrap{padding:28px 36px 80px;max-width:1260px}
.head{margin-bottom:22px}
.head h1{font:600 30px/1.15 var(--serif);letter-spacing:-.01em}
.head p{color:var(--muted);margin-top:6px;max-width:740px}

/* ---------- blocks ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px}
.card h3 em{font-style:normal;color:var(--dim);font-weight:400;margin-left:6px}
a.card:hover{border-color:var(--brass-line)}
.kpi small{display:block;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font:600 28px/1.1 var(--serif);margin-top:6px}
.kpi span{font-size:12px;color:var(--muted)}
.sec{margin-top:28px}
.sec>h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.bar{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:4px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .brass{color:var(--brass-hi)} .ok{color:var(--ok)}
.mono{font-family:var(--mono);font-size:12px}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;margin:0 4px 4px 0;background:none}
.tag.br{color:var(--brass-hi);border-color:var(--brass-line)}
.tag.ok{color:var(--ok);border-color:rgba(143,179,138,.4)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:6px 11px;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.btn:hover{border-color:var(--brass-line);color:var(--text)}
.btn.pri{border-color:var(--brass-line);color:var(--brass-hi);background:var(--brass-soft)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.list{list-style:none}
.list li{padding:8px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px}
.list li:last-child{border-bottom:0}
.list li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--brass);margin-top:8px}
.list a:hover{color:var(--brass-hi)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr[data-go]{cursor:pointer}
tr:hover td{background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;filter:grayscale(.35);border:1px solid var(--line)}
audio{width:100%;height:30px;filter:invert(.88) sepia(.25) hue-rotate(5deg)}
pre.tx{white-space:pre-wrap;word-break:break-word;font:13.5px/1.65 var(--font);color:var(--text)}
pre.tpl{white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:12px;margin:10px 0}
.empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.loading{color:var(--dim);padding:40px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp1{flex:1}

/* hero header + tabs */
.hero{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.hero img{width:72px;height:72px;border-radius:50%;object-fit:cover;filter:grayscale(.3);border:1px solid var(--line);flex:none}
.hero small{font:11px var(--mono);color:var(--brass);letter-spacing:.04em}
.hero h1{font:600 27px/1.15 var(--serif);margin:2px 0}
.hero span{font-size:12.5px;color:var(--dim)}
.ring{margin-left:auto;flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--surface-3) 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:600 15px var(--mono)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto;scrollbar-width:none;position:sticky;top:55px;background:var(--bg);z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a span{font:11px var(--mono);color:var(--dim);margin-left:5px}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--brass-hi);border-bottom-color:var(--brass)}

/* stage pipeline */
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage:hover{border-color:var(--brass-line)}
.stage small{font:10.5px var(--mono);color:var(--dim);letter-spacing:.04em}
.stage b{font-size:13px;font-weight:600}
.stage span{font-size:11.5px;color:var(--dim);line-height:1.35}
.stage.done{border-color:rgba(143,179,138,.35)}
.stage.done b{color:var(--ok)}

/* episodes */
.ep{display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.ep-top{display:flex;gap:12px;align-items:center}
.ep-top img{width:50px;height:50px;border-radius:50%;object-fit:cover;filter:grayscale(.3);border:1px solid var(--line)}
.ep-top small{font:11px var(--mono);color:var(--brass)}
.ep-top b{display:block;font-size:15px}
.ep-top span{font-size:12px;color:var(--dim)}
.ep h4{font:500 17px/1.25 var(--serif)}
.ep-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);gap:8px}
.minis{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.minis i{height:4px;border-radius:2px;background:var(--surface-3);position:relative;overflow:hidden}
.minis i::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--brass)}

/* filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.input{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font:inherit}
.input:focus{outline:none;border-color:var(--brass-line)}
select.input{flex:0 0 auto;min-width:0}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--brass-line);color:var(--brass-hi);background:var(--brass-soft)}
.chip span{font:11px var(--mono);color:var(--dim);margin-left:4px}
.fl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}

/* VO blocks */
.vob{display:grid;grid-template-columns:44px 1fr;gap:14px}
.vob .n{font:600 18px var(--serif);color:var(--brass-hi)}
.vob .n small{display:block;font:10.5px var(--mono);color:var(--dim);margin-top:2px}
.vob .n{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.chk{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font:700 16px var(--font);background:var(--bg)}
.chk:hover{border-color:var(--brass)}
.chk[disabled]{cursor:default}
.vob.done{border-color:rgba(143,179,138,.35)}
.vob.done .chk{background:var(--ok);border-color:var(--ok);color:#0d0e10}
.vob.done pre.tx{color:var(--muted)}
.vob.next{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass-line)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.lang:hover{border-color:var(--brass-line)}
.lang.on{border-color:var(--brass);background:var(--brass-soft)}
.lang .code,.code-sm{font:700 15px var(--mono);border:1px solid var(--brass-line);color:var(--brass-hi);border-radius:8px;padding:8px 10px;flex:none}
.code-sm{font-size:12px;padding:3px 8px;border-radius:6px}
.lang b{display:block;font-size:14px;margin-bottom:6px}
.lang small{display:block;font-size:11.5px;color:var(--dim);margin-top:5px}
.lang.full .bar i{background:var(--ok)}
.vprog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vprog .bar{flex:1;min-width:160px;height:6px}
.vprog .bar i{background:var(--ok)}

/* media */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.th{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0}
.th:hover{border-color:var(--brass-line)}
.th .im{position:relative}
.th img,.th .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-3)}
.th .badge{position:absolute;left:6px;top:6px;font:10px var(--mono);background:rgba(13,14,16,.82);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.th .badge.pk{color:var(--brass-hi);border-color:var(--brass-line)}
.th .play{position:absolute;right:6px;bottom:6px;font-size:10px;background:rgba(13,14,16,.82);border-radius:4px;padding:1px 5px;color:var(--text)}
.th .cap{padding:7px 9px 9px;font-size:12px;line-height:1.35}
.th .cap b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .cap span{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .cap em{display:block;font-style:normal;color:var(--brass);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veo img,.veo video,.kf{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;border:1px solid var(--line);margin-bottom:12px;background:var(--surface-3)}
.veo.done{border-color:var(--brass-line)}
.q{display:flex;flex-direction:column;gap:10px}
.q p{font:500 15px/1.5 var(--serif)}
.q footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px}
.steps{counter-reset:s}
.step{position:relative;padding-left:44px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--brass-line);color:var(--brass-hi);display:grid;place-items:center;font:12px var(--mono)}
.step small{font:11px var(--mono);color:var(--brass);letter-spacing:.06em}
.step b{display:block;margin:2px 0 4px}
.pp{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:10px}
.pp small{font:10.5px var(--mono);color:var(--brass);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* modal */
.mod-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.mod-bg.on{display:flex}
.mod{width:min(980px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mod .media{background:#000;display:grid;place-items:center}
.mod .media video,.mod .media img{max-width:100%;max-height:60vh;width:auto;display:block}
.mod .body{padding:18px 20px 20px;display:grid;gap:12px}
.mod .x{position:sticky;top:0;float:right;margin:10px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);z-index:2}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{min-width:0;word-break:break-word}

/* palette */
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal-bg.on{display:flex}
.pal{width:min(620px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--text);font:15px var(--font)}
.pal input:focus{outline:none}
.pal ul{list-style:none;max-height:52vh;overflow:auto;padding:6px}
.pal li{padding:9px 12px;border-radius:7px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-size:13.5px}
.pal li span{color:var(--dim);font-size:12px;white-space:nowrap}
.pal li.on{background:var(--brass-soft);color:var(--brass-hi)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--brass-line);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

@media (max-width:1180px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .langs{grid-template-columns:minmax(0,1fr)}
  .side{transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
  body.nav-on .side{transform:none}
  body.nav-on .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:grid;place-items:center}
  .top{padding:10px 16px}
  .top .pill{display:none}
  .wrap{padding:20px 16px 60px}
  .head h1{font-size:25px}
  .hero img{width:54px;height:54px}.hero h1{font-size:21px}.ring{width:52px;height:52px}.ring b{width:42px;height:42px;font-size:13px}
  .tabs{top:55px;margin:0 -16px 18px;padding:0 8px}
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vob{grid-template-columns:minmax(0,1fr)}
  .vob .n{flex-direction:row;align-items:center;gap:12px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><small>Cinematic Thoughtcast</small><b>Архітектори Розуму</b><span>AI Titans · Сезон 1 · 10 героїв</span></div>
  <button class="kbtn" id="openPal" aria-label="Пошук і перехід">Пошук і перехід… <kbd>⌘K</kbd></button>
  <nav id="nav"></nav>

// одночасно грає лише одне аудіо чи відео
document.addEventListener("play",function(ev){$$("audio,video").forEach(function(a){if(a!==ev.target)a.pause()})},true);

/* ---- ⌘K ---- */
var palItems=[],palIdx=0;
function palSource(){var a=[{t:"Огляд сезону",d:"Студія",go:"#/overview"}];
  S.forEach(function(e){a.push({t:"EP"+e.ep+" · "+e.name,d:e.title,go:"#/ep/"+e.ep});
    tabsFor(e.ep).slice(1).forEach(function(t){a.push({t:e.name+" → "+t[1],d:TAB_HINT[t[0]],go:"#/ep/"+e.ep+"/"+t[0]})})});
  LIB.concat(REF).forEach(function(i){a.push({t:i.t,d:i.d,go:"#/"+i.id})});
  EXT.forEach(function(i){a.push({t:i.t,d:"окрема сторінка",go:i.href,ext:true})});return a}
function palDraw(){var raw=$("#palIn").value.trim(),s=raw.toLowerCase(),src=palSource();
  palItems=src.filter(function(x){return!s||(x.t+" "+x.d).toLowerCase().indexOf(s)>-1}).slice(0,14);
  if(s)palItems.push({t:"Шукати «"+raw+"» у цитатах",d:"1000 цитат",go:"#/quotes?s="+encodeURIComponent(raw)});
  palIdx=Math.min(palIdx,palItems.length-1);if(palIdx<0)palIdx=0;
  $("#palList").innerHTML=palItems.map(function(x,i){return'<li data-i="'+i+'" class="'+(i===palIdx?"on":"")+'">'+esc(x.t)+'<span>'+esc(x.d)+'</span></li>'}).join("")}
function palGo(i){var x=palItems[i];if(!x)return;palClose();if(x.ext)window.open(x.go,"_blank","noopener");else location.hash=x.go}
function palOpen(){$("#palBg").classList.add("on");$("#palIn").value="";palIdx=0;palDraw();setTimeout(function(){$("#palIn").focus()},10)}
function palClose(){$("#palBg").classList.remove("on")}
$("#openPal").addEventListener("click",palOpen);
$("#palIn").addEventListener("input",function(){palIdx=0;palDraw()});
$("#palList").addEventListener("click",function(ev){var li=ev.target.closest("li");if(li)palGo(+li.dataset.i)});
$("#palBg").addEventListener("click",function(ev){if(ev.target.id==="palBg")palClose()});
document.addEventListener("keydown",function(ev){
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="k"){ev.preventDefault();$("#palBg").classList.contains("on")?palClose():palOpen();return}
  if(ev.key==="Escape"&&$("#modBg").classList.contains("on")){closeMod();return}
  if(ev.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ev.preventDefault();palOpen();return}
  if(!$("#palBg").classList.contains("on"))return;
  if(ev.key==="Escape")palClose();
  else if(ev.key==="ArrowDown"){palIdx=Math.min(palIdx+1,palItems.length-1);palDraw();ev.preventDefault()}
  else if(ev.key==="ArrowUp"){palIdx=Math.max(palIdx-1,0);palDraw();ev.preventDefault()}
  else if(ev.key==="Enter")palGo(palIdx)});

function pills(){var m=MON["01"];$("#pillMontage").textContent=m?"EP01 змонтовано · "+m.total_duration:"";$("#pillMontage").style.display=m?"":"none";
  var avg=Math.round(S.reduce(function(a,e){return a+sum(e.ep).pct},0)/(S.length||1));$("#pillReady").textContent="Сезон "+avg+"%"}
$("#sideFoot").textContent="Версія Claude · дані "+(SUM.generated||"");
pills();route();
})();
</script>
