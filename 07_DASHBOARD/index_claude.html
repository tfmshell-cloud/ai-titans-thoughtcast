<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Архітектори Розуму — Студія</title>
<meta name="description" content="Cinematic Thoughtcast: AI Titans — робочий хаб сезону 1: епізоди, монтаж, анімація, музика, медіа, цитати.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --surface:#141518; --surface-2:#1a1c20; --surface-3:#212429;
  --line:#26292e; --line-soft:#1d1f23;
  --text:#ebe7df; --muted:#a29e95; --dim:#6f6c66;
  --brass:#c8a96a; --brass-hi:#dcc28a; --brass-soft:rgba(200,169,106,.12); --brass-line:rgba(200,169,106,.35);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --side:256px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line-soft)}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.brand b{display:block;font:600 19px/1.2 var(--serif);margin-top:4px}
.brand span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.kbtn{margin:14px 14px 6px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:13px;background:var(--bg)}
.kbtn:hover{border-color:var(--brass-line);color:var(--muted)}
.kbtn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
nav{flex:1;overflow:auto;padding:6px 10px 20px}
.ng{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:16px 10px 6px}
.ni{display:flex;flex-direction:column;padding:7px 10px;border-radius:7px;border-left:2px solid transparent}
.ni b{font-weight:500;font-size:13.5px}
.ni i{font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.35}
.ni:hover{background:var(--surface-2)}
.ni.on{background:var(--brass-soft);border-left-color:var(--brass)}
.ni.on b{color:var(--brass-hi)}
.ni.ext b::after{content:" ↗";color:var(--dim);font-weight:400}
.side-foot{padding:12px 20px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--dim)}

/* ---------- main ---------- */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:30;background:rgba(13,14,16,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);padding:14px 36px;display:flex;align-items:center;gap:14px}
.crumbs{font-size:12.5px;color:var(--dim)}
.crumbs a:hover{color:var(--text)}
.crumbs b{color:var(--muted);font-weight:500}
.menu-btn{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px}
.top .sp{flex:1}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.br{color:var(--brass-hi);border-color:var(--brass-line);background:var(--brass-soft)}
.wrap{padding:30px 36px 80px;max-width:1240px}
.head{margin-bottom:24px}
.head h1{font:600 30px/1.15 var(--serif);letter-spacing:-.01em}
.head p{color:var(--muted);margin-top:6px;max-width:720px}

/* ---------- blocks ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px}
.card h3 em{font-style:normal;color:var(--dim);font-weight:400;margin-left:6px}
.kpi small{display:block;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font:600 28px/1.1 var(--serif);margin-top:6px}
.kpi span{font-size:12px;color:var(--muted)}
.sec{margin-top:30px}
.sec>h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.bar{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:4px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .brass{color:var(--brass-hi)}
.mono{font-family:var(--mono);font-size:12px}
.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;margin:0 4px 4px 0}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:6px 11px;color:var(--muted);background:var(--surface-2)}
.btn:hover{border-color:var(--brass-line);color:var(--text)}
.btn.pri{border-color:var(--brass-line);color:var(--brass-hi);background:var(--brass-soft)}
.list{list-style:none}
.list li{padding:8px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px}
.list li:last-child{border-bottom:0}
.list li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--brass);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;filter:grayscale(.35);border:1px solid var(--line)}
audio{width:100%;height:30px;filter:invert(.88) sepia(.25) hue-rotate(5deg)}

/* episodes */
.ep{display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.ep:hover{border-color:var(--brass-line)}
.ep-top{display:flex;gap:12px;align-items:center}
.ep-top img{width:54px;height:54px;border-radius:50%;object-fit:cover;filter:grayscale(.3);border:1px solid var(--line)}
.ep-top small{font:11px var(--mono);color:var(--brass)}
.ep-top b{display:block;font-size:15px}
.ep-top span{font-size:12px;color:var(--dim)}
.ep h4{font:500 17px/1.25 var(--serif)}
.ep q{font-size:12.5px;color:var(--muted);quotes:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ep-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

/* filters */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.input{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font:inherit}
.input:focus{outline:none;border-color:var(--brass-line)}
select.input{flex:0 0 auto;min-width:0}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.chip.on{border-color:var(--brass-line);color:var(--brass-hi);background:var(--brass-soft)}

/* media */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.th{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.th img,.th .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-3)}
.th div{padding:7px 9px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th div span{color:var(--dim)}
.veo img,.veo video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;border:1px solid var(--line);margin-bottom:12px;background:var(--surface-3)}
.veo.done{border-color:var(--brass-line)}
.q{display:flex;flex-direction:column;gap:10px}
.q p{font:500 15px/1.5 var(--serif)}
.q footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px}
.steps{counter-reset:s}
.step{position:relative;padding-left:44px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--brass-line);color:var(--brass-hi);display:grid;place-items:center;font:12px var(--mono)}
.step small{font:11px var(--mono);color:var(--brass);letter-spacing:.06em}
.step b{display:block;margin:2px 0 4px}
pre.tpl{white-space:pre-wrap;font:12.5px/1.6 var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:12px;margin:10px 0}
.empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.loading{color:var(--dim);padding:40px 0}

/* palette */
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal-bg.on{display:flex}
.pal{width:min(620px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;color:var(--text);font:15px var(--font)}
.pal input:focus{outline:none}
.pal ul{list-style:none;max-height:52vh;overflow:auto;padding:6px}
.pal li{padding:9px 12px;border-radius:7px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-size:13.5px}
.pal li span{color:var(--dim);font-size:12px;white-space:nowrap}
.pal li.on{background:var(--brass-soft);color:var(--brass-hi)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--brass-line);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.scrim{display:none}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .side{transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
  body.nav-on .side{transform:none}
  body.nav-on .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:grid;place-items:center}
  .top{padding:10px 16px}
  .top .pill{display:none}
  .wrap{padding:22px 16px 60px}
  .head h1{font-size:25px}
  .g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .g4.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><small>Cinematic Thoughtcast</small><b>Архітектори Розуму</b><span>AI Titans · Сезон 1 · 10 епізодів</span></div>
  <button class="kbtn" id="openPal" aria-label="Пошук і перехід">Пошук і перехід… <kbd>⌘K</kbd></button>
  <nav id="nav"></nav>
  <div class="side-foot">Версія Claude · дані з <span class="mono">data/*.js</span></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="top">
    <button class="menu-btn" id="menuBtn" aria-label="Меню">☰</button>
    <div class="crumbs" id="crumbs"></div>
    <div class="sp"></div>
    <span class="pill br" id="pillMontage"></span>
    <span class="pill" id="pillReady"></span>
  </header>
  <main class="wrap" id="view"><div class="loading">Завантаження…</div></main>
</div>
<div class="pal-bg" id="palBg"><div class="pal" role="dialog" aria-label="Пошук"><input id="palIn" placeholder="Куди перейти? Розділ, герой, або текст для пошуку в цитатах" autocomplete="off"><ul id="palList"></ul></div></div>
<div class="toast" id="toast"></div>

<script src="data/season1_index.js?v=20261112_c1"></script>
<script src="data/suno_master_pool.js?v=20261112_c1"></script>
<script src="data/veo_animation_pipeline.js?v=20261112_c1"></script>
<script src="data/montage_status.js?v=20261112_c1"></script>
<script>
(function(){
"use strict";
var V="20261112_c1";
var S=window.SEASON1_INDEX||[], SUNO=window.SUNO_MASTER_POOL||[], VEO=window.VEO_ANIMATION_PIPELINE||[], MON=window.MONTAGE_STATUS||{};
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function store(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},1800)}
function copy(txt,label){var done=function(){toast("Скопійовано: "+(label||"текст"))};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fb)}else fb();
  function fb(){var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()}}
var loaded={};
function need(file,glob){if(window[glob])return Promise.resolve(window[glob]);if(loaded[file])return loaded[file];
  loaded[file]=new Promise(function(res,rej){var s=document.createElement("script");s.src="data/"+file+"?v="+V;s.onload=function(){res(window[glob])};s.onerror=rej;document.head.appendChild(s)});return loaded[file]}
function byEp(ep){return S.filter(function(h){return h.ep===ep})[0]}

/* ---- readiness (та сама формула, що й у старому хабі) ---- */
function heroTracks(ep){var out=[];SUNO.forEach(function(t){if(t.hero_ep===ep)out.push(t);else(t.extra_bins||[]).forEach(function(b){if(b.ep===ep||String(b.smart_bin).indexOf("EP"+ep+"_")===0)out.push(t)})});return out}
function act1(ep){return SUNO.filter(function(t){return t.hero_ep===ep&&t.smart_bin.indexOf("_ACT1_")>-1})[0]}
function ready(h){var c=store("aititans_progress_v2_"+h.ep)||{},sopT=h.sop_tasks_count||22,sop=0,vid=0,vo=0;
  Object.keys(c).forEach(function(k){if(k.indexOf("ep"+h.ep+"_s")===0&&c[k])sop++});
  for(var i=1;i<=100;i++)if(c["vid_"+i])vid++;
  var sT=h.suno_count||16,sd=Math.min(sT,(heroTracks(h.ep).length||4)+Object.keys(c).filter(function(k){return/^suno_/.test(k)&&c[k]}).length);
  var voT=h.vo_count||10;for(var v=0;v<voT;v++)if(c["vo_"+v])vo++;
  var p=Math.round(sop/sopT*70+vid/100*15+sd/sT*10+vo/voT*5);if(sop===sopT&&sopT>0&&!vid&&!vo)p=100;
  return{pct:Math.min(100,p),sop:sop,sopT:sopT}}
function veoMap(){var m=store("ai_titans_veo_status");if(m)return m;m={};VEO.forEach(function(v){m[v.id]=!!v.default_done});return m}

/* ---- navigation ---- */
var NAV=[
 {g:"Сезон",items:[
  {id:"overview",t:"Огляд",d:"Стан сезону й що робити далі"},
  {id:"episodes",t:"Епізоди",d:"10 героїв, готовність, сторінки"}]},
 {g:"Виробництво",items:[
  {id:"montage",t:"Монтаж",d:"Режисерська версія EP01 у Resolve"},
  {id:"veo",t:"Анімація Veo",d:"14 ключових сцен, позначки готовності"},
  {id:"music",t:"Музика Suno",d:"16 треків 92 BPM з прослуховуванням"},
  {id:"media",t:"Медіа-сховище",d:"Відео, фото, архіви по героях"}]},
 {g:"Знання",items:[
  {id:"quotes",t:"Цитати",d:"1000 цитат, пошук і копіювання"},
  {id:"pipeline",t:"Пайплайн",d:"8 кроків, цехи, 5-денний спринт"},
  {id:"templates",t:"Шаблони промптів",d:"AI Studio, Veo, Flow, Suno"}]},
 {g:"Інші сторінки",items:[
  {href:"season1_telemetry_dashboard.html",t:"Телеметрія сезону",d:"Статистика по всіх епізодах"},
  {href:"media_vault_analysis.html",t:"Аналіз медіа-волту",d:"Посекундний розбір футажів"},
  {href:"cinematic_innovations.html",t:"20 фішок монтажу",d:"Тріади Google Flow"},
  {href:"50_scenes_hassabis.html",t:"50 сцен Гассабіса",d:"Біографічні сюжети EP03"},
  {href:"index_legacy.html",t:"Хаб Antigravity",d:"Попередня версія, збережена"}]}
];
function title(id){var r=null;NAV.forEach(function(g){g.items.forEach(function(i){if(i.id===id)r=i})});return r}
function renderNav(cur){$("#nav").innerHTML=NAV.map(function(g){return'<div class="ng">'+esc(g.g)+'</div>'+g.items.map(function(i){
  var on=i.id&&(cur===i.id||(cur==="ep"&&i.id==="episodes"));
  return i.href?'<a class="ni ext" href="'+i.href+'" target="_blank" rel="noopener"><b>'+esc(i.t)+'</b><i>'+esc(i.d)+'</i></a>'
   :'<a class="ni'+(on?" on":"")+'" href="#/'+i.id+'"><b>'+esc(i.t)+'</b><i>'+esc(i.d)+'</i></a>'}).join("")}).join("")}
function head(h,p){return'<div class="head"><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>'}
function crumbs(parts){$("#crumbs").innerHTML='<a href="#/overview">Студія</a>'+parts.map(function(p){return' · '+(p.h?'<a href="'+p.h+'">'+esc(p.t)+'</a>':'<b>'+esc(p.t)+'</b>')}).join("")}

/* ---- views ---- */
var VIEWS={};
VIEWS.overview=function(){
  var words=S.reduce(function(a,h){return a+(h.script_words||0)},0), r=S.map(ready), avg=Math.round(r.reduce(function(a,x){return a+x.pct},0)/(S.length||1));
  var vm=veoMap(), vd=VEO.filter(function(v){return vm[v.id]}).length, m=MON["01"];
  var h=head("Сезон 1 — огляд","Усе виробництво «Архітекторів Розуму» в одному місці. Ліворуч розділи за етапами роботи; ⌘K — швидкий перехід куди завгодно.");
  h+='<div class="grid g4 kpis">'+
   kpi("Епізодів",S.length,"герої від Альтмана до Ина")+
   kpi("Слів сценарію",words.toLocaleString("uk-UA"),"у всіх 10 сценаріях")+
   kpi("Анімація Veo",vd+" / "+VEO.length,"ключових сцен готово")+
   kpi("Середня готовність",avg+"%","за чеклистами епізодів")+'</div>';
  if(m){h+='<div class="sec"><h2>Зараз у роботі</h2><a class="card" href="#/montage" style="display:block"><div class="ep-top" style="margin-bottom:10px"><img src="'+esc(byEp("01").avatar)+'" alt=""><div><small>EP01 · МОНТАЖ</small><b>'+esc(m.headline)+'</b><span>'+esc(m.full_timeline)+' · '+esc(m.total_duration)+' · '+m.total_shots+' планів · оновлено '+esc(m.updated)+'</span></div></div><p class="muted" style="font-size:13px">'+esc(m.concept)+'</p></a></div>';

/* ---- router ---- */
function parse(){var h=location.hash.replace(/^#\/?/,"")||"overview",p=h.split("?"),path=p[0].split("/"),q={};
  (p[1]||"").split("&").forEach(function(kv){if(kv){var a=kv.split("=");q[a[0]]=decodeURIComponent(a[1]||"")}});return{id:path[0],arg:path[1],q:q}}
function route(){var r=parse(),fn=VIEWS[r.id]||VIEWS.overview,id=VIEWS[r.id]?r.id:"overview";
  $("#view").innerHTML=fn(r.id==="ep"?r.arg:r.q);renderNav(id);
  if(id==="ep"){var e=byEp(r.arg);crumbs([{t:"Епізоди",h:"#/episodes"},{t:e?"EP"+e.ep+" · "+e.name:"?"}]);document.title=(e?e.name+" — ":"")+"Архітектори Розуму"}
  else{var t=title(id);crumbs([{t:t.t}]);document.title=t.t+" — Архітектори Розуму"}
  document.body.classList.remove("nav-on");window.scrollTo(0,0);
  var sel=$("#veoEp");if(sel)sel.addEventListener("change",function(){location.hash="#/veo?f="+(r.q.f||"all")+(sel.value?"&ep="+sel.value:"")})}
window.addEventListener("hashchange",route);

document.addEventListener("click",function(ev){var t=ev.target.closest("[data-copy],[data-veo],[data-copyveo],[data-tpl],[data-go]");if(!t)return;

/* ---- ⌘K palette ---- */
var palItems=[],palIdx=0;
function palSource(){var a=[];NAV.forEach(function(g){g.items.forEach(function(i){a.push({t:i.t,d:g.g,go:i.href||"#/"+i.id,ext:!!i.href})})});
  S.forEach(function(e){a.push({t:"EP"+e.ep+" · "+e.name,d:e.title,go:"#/ep/"+e.ep});a.push({t:"Сторінка епізоду: "+e.name,d:"повна сторінка",go:e.page_url,ext:false,page:true})});return a}
function palDraw(){var s=$("#palIn").value.trim().toLowerCase(),src=palSource();
  palItems=src.filter(function(x){return!s||(x.t+" "+x.d).toLowerCase().indexOf(s)>-1}).slice(0,12);
  if(s)palItems.push({t:"Шукати «"+$("#palIn").value.trim()+"» у цитатах",d:"1000 цитат",go:"#/quotes?s="+encodeURIComponent($("#palIn").value.trim())});
  palIdx=Math.min(palIdx,palItems.length-1);if(palIdx<0)palIdx=0;
  $("#palList").innerHTML=palItems.map(function(x,i){return'<li data-i="'+i+'" class="'+(i===palIdx?"on":"")+'">'+esc(x.t)+'<span>'+esc(x.d)+'</span></li>'}).join("")}
function palGo(i){var x=palItems[i];if(!x)return;palClose();if(x.ext)window.open(x.go,"_blank","noopener");else if(x.page)location.href=x.go;else location.hash=x.go}
function palOpen(){$("#palBg").classList.add("on");$("#palIn").value="";palIdx=0;palDraw();setTimeout(function(){$("#palIn").focus()},10)}
function palClose(){$("#palBg").classList.remove("on")}
$("#openPal").addEventListener("click",palOpen);
$("#palIn").addEventListener("input",function(){palIdx=0;palDraw()});
$("#palList").addEventListener("click",function(ev){var li=ev.target.closest("li");if(li)palGo(+li.dataset.i)});
$("#palBg").addEventListener("click",function(ev){if(ev.target.id==="palBg")palClose()});
document.addEventListener("keydown",function(ev){
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="k"){ev.preventDefault();$("#palBg").classList.contains("on")?palClose():palOpen();return}
  if(ev.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ev.preventDefault();palOpen();return}
  if(!$("#palBg").classList.contains("on"))return;
  if(ev.key==="Escape")palClose();
  else if(ev.key==="ArrowDown"){palIdx=Math.min(palIdx+1,palItems.length-1);palDraw();ev.preventDefault()}
  else if(ev.key==="ArrowUp"){palIdx=Math.max(palIdx-1,0);palDraw();ev.preventDefault()}
  else if(ev.key==="Enter")palGo(palIdx)});
